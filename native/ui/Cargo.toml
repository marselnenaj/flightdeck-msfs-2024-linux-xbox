[package]
name = "flightdeck-ui"
version = "0.2.8"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Native Flightdeck desktop interface"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "advanced", "svg", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "fs", "process"] }

[dev-dependencies]
iced_test = "=0.14.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
