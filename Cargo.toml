[package]
name = "flightdeck-linux"
version = "0.3.7"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Local MSFS launcher for Linux"
publish = false
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "native/**", "tests/*.rs", "tests/fixtures/**", "examples/**", "ui/*.svg", "ui/*.png", "ui/*.woff2", "scripts/runtime/*", "compat/*.json", "compat/fenix/*.json", "compat/mobiflight/**"]

[lib]
name = "flightdeck"
path = "native/lib.rs"

[features]
bundled-media = []
bundled-mobiflight = []

[[bin]]
name = "flightdeck-rust"
path = "native/main.rs"

[dependencies]
fenix-patch = { git = "https://github.com/marselnenaj/fenix-a320-linux-patch", rev = "0c8079c61337e5699d0568ec9ffc66354b86708d" }
flightdeck-ui = { path = "native/ui" }
tar = "0.4"
flate2 = "1"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1"
quick-xml = "0.42.0"
libloading = "0.8.9"
subtle = "2.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
rustix = { version = "1.1.4", features = ["fs", "process", "pipe", "event", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "0.11.1"
uuid = { version = "1.26.0", features = ["v4"] }
sevenz-rust2 = { version = "=0.24.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
# Test peers bind sockets that never listen.
rustix = { version = "1.1.4", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
members = ["native/ui", "tools"]
exclude = ["examples/native-ui"]
resolver = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
