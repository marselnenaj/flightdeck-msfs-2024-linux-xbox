[package]
name = "flightdeck-linux"
version = "0.2.8"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Local MSFS launcher for Linux"
publish = false
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "native/**", "tests/*.rs", "tests/fixtures/**", "examples/**", "ui/*.svg", "ui/*.png", "ui/*.woff2", "scripts/runtime/*", "compat/*.json", "compat/fenix/*.json"]

[lib]
name = "flightdeck"
path = "native/lib.rs"

[[bin]]
name = "flightdeck-rust"
path = "native/main.rs"

[dependencies]
flightdeck-ui = { path = "native/ui" }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
libloading = "0.8.9"
subtle = "2.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
rustix = { version = "1.1.4", features = ["fs", "process", "pipe", "event", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
members = ["native/ui"]
exclude = ["examples/native-ui"]
resolver = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
