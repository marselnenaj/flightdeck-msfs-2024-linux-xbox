[package]
name = "flightdeck-tools"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Maintainer tooling for Flightdeck: checks, packaging and releases"
publish = false

[[bin]]
name = "flightdeck-tools"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1"
hex = "0.4.3"
percent-encoding = "2.3.2"
regex = "1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
tar = "0.4"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
