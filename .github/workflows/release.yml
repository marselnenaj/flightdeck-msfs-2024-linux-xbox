name: Publish a verified native release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flightdeck-stable-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'marselnenaj/flightdeck-msfs-2024-linux-xbox' && startsWith(github.event.head_commit.message, 'Release Flightdeck ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    outputs:
      eligible: ${{ steps.commit.outputs.eligible }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Build the maintainer tooling
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo build --locked -p flightdeck-tools
      - name: Require the exact release subject and an unpublished stable version
        id: commit
        run: target/debug/flightdeck-tools release gate

  build:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ICED_TEST_BACKEND: tiny-skia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned toolchain and native build prerequisites
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-docs
          sudo apt-get update
          sudo apt-get install -y build-essential binutils bubblewrap woff2 pkg-config liblzma-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev flex bison gcc-mingw-w64-x86-64 autoconf automake libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Build the maintainer tooling
        run: |
          cargo build --locked -p flightdeck-tools
          mkdir -p build
          cp target/debug/flightdeck-tools build/flightdeck-tools
      - name: Format, lint and test the locked workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bash scripts/native-ci-tests.sh build/flightdeck-tools native-tests
          build/flightdeck-tools source-check
      - name: Check native HTTP contract and render both UI languages
        run: |
          cargo build --locked --bin flightdeck-rust --example runtime-lab
          build/flightdeck-tools http-contract --binary target/debug/flightdeck-rust
          cargo test --locked -p flightdeck-ui capture_ -- --ignored
      - name: Fetch and validate pinned compatibility, graphics and corresponding sources
        run: build/flightdeck-tools release prepare --cache build/release-inputs --output build/release-previous
      - name: Build and assemble the complete native package
        run: |
          cc -O2 tests/graphics/media-caps.c -o build/media-caps $(pkg-config --cflags --libs gstreamer-1.0)
          build/media-caps
          build/flightdeck-tools media-build --download --sources build/media-inputs --work build/media-work --output build/media --jobs 2
          cargo test --locked --features bundled-media --lib media_overlay
          build/flightdeck-tools build-native --toolchain 1.98.0 --bundled-media
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > build/cargo-metadata.json
          build/flightdeck-tools package \
            --binary target/release/flightdeck-rust \
            --cargo-metadata build/cargo-metadata.json \
            --rust-notices "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" \
            --native build/release-inputs/native.tar.gz \
            --graphics build/release-previous/flightdeck-linux/resources/graphics \
            --output build/release-assets
          build/flightdeck-tools source-release --media-sources build/media-inputs --output "build/release-assets/flightdeck-source-${RELEASE_VERSION}.tar.gz"
          build/flightdeck-tools release unpack --archive build/release-assets/Flightdeck-Linux-x86_64.tar.gz --output build/release-current
      - name: Test actual installation, service handoff and rollback against the pinned previous release
        run: |
          build/flightdeck-tools package-check \
            --package build/release-current/flightdeck-linux \
            --previous-native build/release-previous/flightdeck-linux \
            --output build/release-package-check
      - name: Bind the tested assets and corresponding sources to this commit
        run: |
          build/flightdeck-tools release stage \
            --assets build/release-assets --cache build/release-inputs \
            --check build/release-package-check/result.json --commit "$GITHUB_SHA"
          build/flightdeck-tools release notes --output build/release-notes.md
      - name: Retain validated publish inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            build/release-assets/*
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain local build evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            build/release-assets/*
            build/release-package-check/result.json
            build/native-ui/*.png
            build/ui-parity/*.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  release:
    needs: [gate, build]
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: build/publish-inputs
      # Dependency build scripts run in this step. It has no token; only the
      # finished tool in the next step receives one.
      - name: Build the maintainer tooling
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo build --locked -p flightdeck-tools
      - name: Create a new draft, verify uploaded bytes and publish as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target/debug/flightdeck-tools release publish \
            --assets build/publish-inputs/release-assets \
            --notes build/publish-inputs/release-notes.md \
            --readback build/release-readback
