name: Launcher and source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-docs
      - name: Native desktop and namespace test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap woff2 libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev pkg-config
      - name: Format and lint
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the maintainer tooling and check the source-release boundary
        run: |
          cargo +1.98.0 build --locked -p flightdeck-tools
          mkdir -p build
          cp target/debug/flightdeck-tools build/flightdeck-tools
          build/flightdeck-tools source-check
      - name: Native format, filesystem and concurrency tests
        run: build/flightdeck-tools native-tests
      - name: Native HTTP contract and developer probes
        run: |
          cargo +1.98.0 build --locked --bin flightdeck-rust --example runtime-lab
          build/flightdeck-tools http-contract --binary target/debug/flightdeck-rust
      - name: Native desktop rendering in both languages and window sizes
        run: |
          ICED_TEST_BACKEND=tiny-skia cargo +1.98.0 test --locked -p flightdeck-ui capture_ -- --ignored
      - name: Build native launcher and source artifacts
        run: |
          build/flightdeck-tools build-native --toolchain 1.98.0
          cargo +1.98.0 metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > build/cargo-metadata.json
          build/flightdeck-tools package --binary target/release/flightdeck-rust --cargo-metadata build/cargo-metadata.json --rust-notices "$(rustc +1.98.0 --print sysroot)/share/doc/rust/COPYRIGHT-library.html" --launcher-only --output build/native-launcher-package
          build/flightdeck-tools source-release --output build/flightdeck-source.tar.gz
      - name: Retain native development packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flightdeck-native-development
          path: |
            build/native-launcher-package/*
            build/flightdeck-source.tar.gz
            build/flightdeck-tools
            build/native-ui/*.png
            build/ui-parity/*.png
          if-no-files-found: error
          retention-days: 14
  linux-desktop:
    needs: rust-launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distribution: [ubuntu, debian, fedora, arch, opensuse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flightdeck-native-development
          path: build/native-development
      # The tooling built and tested by the previous job also runs inside the
      # test container; artifacts do not keep the executable bit.
      - name: Extract the package built by this workflow
        run: |
          chmod +x build/native-development/flightdeck-tools
          build/native-development/flightdeck-tools release unpack \
            --archive build/native-development/native-launcher-package/Flightdeck-Launcher-Linux-x86_64.tar.gz \
            --output build/linux-test-package
      - name: Install, exercise HTTP and open X11 and Wayland windows
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          build/native-development/flightdeck-tools distro-check --distribution "$DISTRIBUTION" \
            --package build/linux-test-package/flightdeck-linux \
            --output "build/linux-check-$DISTRIBUTION"
      - name: Retain distribution and desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.distribution }}
          path: build/linux-check-${{ matrix.distribution }}/*
          if-no-files-found: warn
          retention-days: 14
