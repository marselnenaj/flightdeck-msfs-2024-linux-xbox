name: Launcher and source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-docs
      - name: Native desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y woff2 libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev pkg-config
      - name: Format and lint
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Native format, filesystem and concurrency tests
        run: cargo +1.98.0 test --locked --workspace
      - name: Native HTTP contract and developer probes
        run: |
          cargo +1.98.0 build --locked --bin flightdeck-rust --example runtime-lab
          python3 scripts/check-rust-http.py --binary target/debug/flightdeck-rust
      - name: Native desktop rendering in both languages and window sizes
        run: |
          ICED_TEST_BACKEND=tiny-skia cargo +1.98.0 test --locked -p flightdeck-ui capture_ -- --ignored
      - name: Build native launcher and source artifacts
        run: |
          python3 scripts/build-native.py --toolchain 1.98.0
          mkdir -p build
          cargo +1.98.0 metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > build/cargo-metadata.json
          python3 scripts/native-release.py --binary target/release/flightdeck-rust --cargo-metadata build/cargo-metadata.json --rust-notices "$(rustc +1.98.0 --print sysroot)/share/doc/rust/COPYRIGHT-library.html" --launcher-only --output build/native-launcher-package
          python3 scripts/source-release.py --output build/flightdeck-source.tar.gz
      - name: Retain native development packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flightdeck-native-development
          path: |
            build/native-launcher-package/*
            build/flightdeck-source.tar.gz
            build/native-ui/*.png
            build/ui-parity/*.png
          if-no-files-found: error
          retention-days: 14
  maintainer-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build tooling and compatibility boundary tests
        run: python -m unittest discover -s tests/compat -p 'test_*.py' -v
      - name: Source-release boundary
        run: python scripts/check-source-export.py
