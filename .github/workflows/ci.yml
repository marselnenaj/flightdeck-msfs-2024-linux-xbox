name: Launcher and source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Launcher, setup and installer tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: UI state tests
        run: node --test ui/tests/*.test.mjs
      - name: Source-release boundary
        run: python scripts/check-source-export.py
      - name: Compatibility packaging tests
        if: matrix.python == '3.14'
        run: python -m unittest discover -s tests/compat -p 'test_*.py' -v
      - name: Real Chromium UI checks
        if: matrix.python == '3.14'
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node ui/tests/browser-test.mjs
      - name: Build launcher wheel and source package
        if: matrix.python == '3.14'
        run: |
          python -m pip install 'build>=1.2,<2' 'setuptools>=77,<85'
          python -m build --wheel --no-isolation
          python scripts/source-release.py --output build/flightdeck-source.tar.gz
      - name: Retain reviewed packages
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flightdeck-packages
          path: |
            dist/*.whl
            build/flightdeck-source.tar.gz
          if-no-files-found: error
          retention-days: 14
